name: Android release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install NDK (for the ABI stub)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125"
      - name: Build release (armv7 + armv8)
        run: |
          set -o pipefail
          gradle assembleArmv7Release assembleArmv8Release --no-daemon --stacktrace 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/armv7/release/app-armv7-release.apk ] || [ ! -f app/build/outputs/apk/armv8/release/app-armv8-release.apk ]; then
            tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -n 6 build.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Measure APKs
        if: success()
        run: du -h app/build/outputs/apk/*/release/*.apk
      - name: Upload APK (armv7 - 32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: MCPanel-armv7
          path: app/build/outputs/apk/armv7/release/app-armv7-release.apk
      - name: Upload APK (armv8 - 64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: MCPanel-armv8
          path: app/build/outputs/apk/armv8/release/app-armv8-release.apk
