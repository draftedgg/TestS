name: Android release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/release/app-release.apk ] && [ ! -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -n 6 build.log >> "$GITHUB_STEP_SUMMARY"
      - name: Measure APK
        if: success()
        run: du -h app/build/outputs/apk/release/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCPanel-release
          path: app/build/outputs/apk/release/*.apk
